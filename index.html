kafka","卡芙卡强化机制 · HoYoLAB 作者攻略","效果命中达到 75% 的角色可受攻击增益；属于作者解读，非官方公告。","https://www.hoyolab.com/article/39993908"],["swan","黑天鹅 · Honey Hunter","命中转化与持续伤害机制；非官方数据库。","https://starrail.honeyhunterworld.com/black-swan-character/?lang=CN"],["dahlia","大丽花 · 数据库","击破效率、超击破与治疗/护盾触发。非官方资料。","https://www.hsrarchive.cc/characters/1321/"],["ruan","阮·梅 · BWIKI","速度、击破与增益条件。","https://wiki.biligame.com/sr/阮•梅"],["cyrene","昔涟 · Honey Hunter","记忆队协作与不同队员条件。非官方数据库。","https://starrail.honeyhunterworld.com/cyrene-character/?lang=CN"],["hs","海瑟音 · 作者攻略","效果命中转化的培养参考；需要客户端核对。","https://www.kocpc.com.tw/archives/610172"],["archer","Archer · 作者攻略","战技点与连续行动机制参考。","https://www.gamersky.com/handbook/202507/1957930.shtml"]],"teams":[{"id":"elation","name":"欢愉体系","tag":"优先保留主力","summary":"角色与光锥投入已经较完整。先修爻光的确定门槛，再比较双输出与主角辅助；不要把高速防御型银狼改造成常规攻击暴击模板。","variants":[{"name":"银狼主轴","ids":["005","001","008","007"],"note":"主角占用欢愉命途。先验证辅助增益与行动收益。"},{"name":"双输出释放主角","ids":["005","006","008","007"],"note":"绯英接替主角，主角可交给击破或记忆；输出与战技点分配需实测。"}],"roles":["银狼 LV.999：高速核心，速度关系到机制收益。","欢愉主 / 绯英：辅助推进或第二输出，选择影响整个账号主角分配。","爻光：体系增益与行动协作。","真珠：生存及体系联动，防御既影响生存也关系到自身机制。"],"logic":"先由爻光与辅助建立增益，再让核心在有效窗口出手；真珠维持生存和协作。换成绯英时，收益来自增加输出位置，但辅助、资源与行动结构随之改变，不能只比较二人面板。","limits":["适合已有欢愉增益、敌群结构相容的关卡；当期环境尚未录入，不能直接宣布全场景最强。","193 速度并不等于所有战斗自动满足全部上限；要逐项区分静态、入战前与战斗内。","两个版本互斥使用银狼、爻光、真珠，不能作为两支独立队伍。"],"fixes":[{"who":"爻光","current":"速度 159，卜者 4 件；生命球与回能绳均无速度副词条。","action":"以保留回能绳主词条和套装为前提，在球或绳补至少一个速度词条，复核入战前达到 160。","personal":"跨过套装第二档；这是条件明确的修正。","team":"减少增益或暴击档位遗漏，让后续测试使用完整配置。","accept":"角色入战前速度 ≥160；不要用入战后的队友加速代替。","cost":"存量培养"},{"who":"银狼 LV.999","current":"速度 193，防御 2677，双暴 55.1 / 171.6。","action":"保留高速方案；比较战斗内能否稳定达到技能速度转化需求，再决定是否继续刷速。","personal":"速度投入与机制匹配；防御主词条不是常规攻击 C 的错误证据。","team":"避免为追求面板攻击而损失行动频率和体系收益。","accept":"同场景记录开局与稳定期实际速度、有效行动次数；200 作为条件测试点，不写成静态硬性毕业线。","cost":"存量培养"},{"who":"真珠","current":"防御 2598，速度 153，治疗衣，回能 124.4%。","action":"保留当前结构；检查承伤、盾/治疗覆盖，再决定防御副词条或速度。","personal":"当前防御高于资料中的 2400 机制参考点，后续不能只堆数值。","team":"保证输出窗口不因生存断档而被迫中止。","accept":"同一关连续 3 次无减员，紧急治疗次数可控；精确转化以客户端复核。","cost":"存量培养"},{"who":"绯英 / 欢愉主","current":"绯英双暴 76 / 153.4、速 143；欢愉主速 152、回能 124.4%。","action":"保留两套配置，先测试再分配主角。绯英如出现战技点冲突，先改行动选择。","personal":"已有练度可直接参与对照测试，无需先抽新角色。","team":"优先衡量两队合计成绩，而非单队局部最高伤害。","accept":"同敌方与增益各测试 3 次，记录轮次、掉点、阵亡和主角释放后的第二队收益。","cost":"存量培养"}],"short":["爻光入战前 160；四人关键行迹与条件增益可正常触发。","选定银狼主轴或双输出版本，连续 3 次稳定完成目标场景。"],"long":["在不损失生存、回能的前提下细调银狼速度和暴击结构。","建立“欢愉不占主角”的可用版本，为多队提供弹性；星魂专锥不是毕业前置条件。"],"rotation":["手动先确认增益生效，再安排核心爆发。","自动模式单独验收：记录辅助乱开大、关键增益空窗和战技点耗尽。","速度变化后重新保存配置与测试记录。"],"pulls":["暂不补新角色：当前队伍结构完整。","真珠、爻光或输出的专锥/星魂：只有现有瓶颈与其具体效果吻合时再评估；本报告没有足够同配对照数据给出精确收益排序。","舞！舞！舞！同名光锥出现在多个配置中，不代表已确认库存够多；多队前检查实物数量。"],"sources":["yao","wolf","pearl"]},{"id":"archer","name":"Archer × 远坂凛","tag":"战技点与爆发窗口","summary":"Archer 已有 E1 与专锥，凛也有专锥。这个分支首先需要做的是战技点调度与辅助选择，不是再投入抽数补齐四个限定角色。","variants":[{"name":"战技点稳定版","ids":["028","004","018","020"],"note":"花火调度和补点；砂金保生存。与追击队争砂金。"},{"name":"生存替换版","ids":["028","004","018","010"],"note":"腾荒接生存位置，释放砂金；检查护盾覆盖及资源消耗。"}],"roles":["Archer：连续战技输出核心，伤害依赖可用战技点和爆发窗口。","远坂凛：体系协作与自身输出，技能顺序需要配合 Archer。","花火：战技点和拉条辅助；拉条收益要结合 Archer 的行动机制。","砂金 / 腾荒：在不持续消耗大量资源的前提下保护队伍。"],"logic":"辅助先供给资源与增益，Archer 才能把连续攻击兑现为伤害。凛兼顾自身循环和协作；若她或生存位抢走关键战技点，面板再高也无法完成预期连段。","limits":["以单体及精英目标为重点验证；清杂收益需要实战判断。","Archer 面板暴击率 93.6%，再叠暴击增益可能浪费；不能机械套用更多暴击推荐。","自动战斗可能提前花光资源，稳定版和竞速版需要分别记录。"],"fixes":[{"who":"Archer","current":"暴击率 93.6%，暴伤 129.7%，攻击 3019；暴击衣。","action":"先统计战斗内暴击；优先替换带效果命中的攻击绳副词条。暴伤衣仅在替换后实战暴击可靠时使用。","personal":"减少无效命中，提升有效攻击或暴伤；避免一刀切换衣造成暴击缺口。","team":"关键连段输出更稳定，而不是仅提高截图暴伤。","accept":"记录增益后的暴击率与 3 次相同连段；衣服替换必须比较完整配置。","cost":"存量培养"},{"who":"远坂凛","current":"速度 135，回能 119.4%，攻击 2972，双暴 79.3 / 150.6。","action":"保留回能绳为基线；仅当攻击绳不推迟关键终结技时再比较。","personal":"绳位在伤害与循环之间权衡。","team":"避免为个人攻击面板破坏 Archer 的协作窗口。","accept":"同轮次终结技数量、关键点数和爆发窗口不变，才讨论换绳收益。","cost":"存量培养"},{"who":"花火","current":"速度 153，暴伤 212%，舞！舞！舞！S2。","action":"先建立“辅助—核心”行动顺序，按目标轮次再调整速度。","personal":"高暴伤已有基础，速度不要求无条件追 160。","team":"拉条与供点实际覆盖主输出窗口。","accept":"记录前两轮行动顺序，不能只根据面板速度认定循环成功。","cost":"存量培养"},{"who":"砂金 / 腾荒","current":"砂金防御 4595、速 111；腾荒 E1、攻 3336、速 137。","action":"砂金优先试速度鞋但守住防御机制；腾荒替代时记录护盾和用点。","personal":"速度提升能增加主动行动；腾荒的有效主属性按其自身机制判断。","team":"为第二队释放生存位，减少双方同时抢砂金。","accept":"砂金实际换装后防御复核 ≥4000；腾荒版无盾空窗、无爆发断点。","cost":"存量培养"}],"short":["不追加抽卡，确定前三轮资源流；凛回能绳与花火现有配装先保留。","三次测试没有“Archer 可输出时却缺点”的失败，生存位置可独立运作。"],"long":["按实际关卡将部分溢出暴击转成暴伤/攻击，建立替代生存版。","有证据表明辅助而非输出面板是瓶颈时，再投入辅助专锥或星魂。"],"rotation":["进入爆发前检查可用战技点，辅助增益先落地。","保留一份失败记录：哪位角色在哪次行动花掉了关键点数。","自动测试时记录完整两轮，不用一次通关代表长期稳定。"],"pulls":["Archer 已 E1S1：进一步星魂属于高投入选项，当前不列为必抽。","凛已 S1：先优化回能与配速。","花火专锥属于后续伤害投资；当前资源循环若已稳定，其优先级低于修正未完成培养与第二队。"],"sources":["archer","rin"]},{"id":"expedition","name":"姬子·启行远征","tag":"按同行机制配队","summary":"当前已有姬子·启行、星期日、腾荒与三种主角配置。先用现有同行角色验证协作，避免把旧姬子的追击逻辑套给姬子·启行。","variants":[{"name":"同行验证版","ids":["002","001-C","014","010"],"note":"记忆主提供辅助；星期日和腾荒构成已拥有的协作候选。具体同行触发按客户端核对。"},{"name":"释放主角版","ids":["002","034","014","010"],"note":"巡猎三月七替代主角，训练成本较低但增益结构改变。"}],"roles":["姬子·启行：主要输出，行迹与暴击稳定性优先。","记忆主 / 巡猎三月七：辅助或副输出，提供不同的协作方式。","星期日：增益与行动调度；慢速轴必须实际观察。","腾荒：生存及同行协作，优先保持保护覆盖。"],"logic":"根据同行条件产生额外协作，再利用辅助行动将增益集中到输出窗口。四个角色“都已拥有”不意味着配速自动成立，必须记录协作触发者、轮次与战技点变化。","limits":["新体系的资料存在版本差异；该阵容是优先验证方案，未声明为最终最优解。","姬子·启行 131 速、星期日 126 速是慢辅轴候选，但不等于已达到特定轮次行动次数。","如果第三队需要星期日或腾荒，应把机会成本纳入判断。"],"fixes":[{"who":"姬子·启行","current":"E0S1，攻击 3226，速 131，双暴 63.5 / 143.9；关键行迹 9。","action":"先补主要伤害行迹，再在保留套装与主词条的情况下提升有效暴击；暴伤衣低暴击副词条可替换。","personal":"技能倍率投资确定，随后减少关键攻击不暴击的波动。","team":"协作次数相同条件下更稳定，便于判断辅助方案。","accept":"关键伤害行迹满可升上限；依据战斗增益设暴击目标，避免溢出。","cost":"存量培养"},{"who":"星期日","current":"速度 126，暴伤 219.4，过往未来 S5。","action":"以现有慢辅轴先测试；若目标是每轮双行动，再成套调整主 C 与辅助速度。","personal":"过往未来对受益行动有条件，需确认实际接到增益的人。","team":"避免拉条次序与协作冲突，提升有效增益覆盖。","accept":"逐项记录“谁被拉条、谁接到光锥增益”，不以孤立 134 速判定毕业。","cost":"存量培养"},{"who":"记忆主","current":"速度 117，暴伤 232.4，攻击鞋；核心行迹显示 9。","action":"优先补关键行迹并试速度鞋，详见记忆体系；保留原套作为对照。","personal":"提高主动行动机会，但损失攻击与旧鞋暴伤，需要实测。","team":"可能加快增益/召唤循环；并不保证每场都优于慢速方案。","accept":"在启行队单独测试，不能沿用另一支记忆队的结果。","cost":"存量培养"},{"who":"腾荒 / 三月七","current":"腾荒 E1S1、核心行迹 9；三月七 E6 已有装备。","action":"先补腾荒关键保护行迹；需要释放主角时再校验三月七师父选择、套装与行动。","personal":"保证生存底座；三月七属于已有角色替代。","team":"减少为凑体系新增抽卡，并保留第三队主角。","accept":"保护覆盖稳定；替代版本有独立测试记录。","cost":"存量培养"}],"short":["姬子·启行与腾荒的关键行迹补齐；完整协作可触发。","确定一套实测过的配速，主角版和三月七版至少一套稳定达成目标。"],"long":["根据真实敌群优化配速与暴击；优先解决资源空窗。","只在同条件实测证实明显短板后评估新角色；不把“同行标签更多”直接等同于更强。"],"rotation":["开局确认同行/协作状态。","记录一次完整循环的额外行动、战技点和辅助覆盖。","将长战与短战分开测试；暖机效果不能拿首轮单次伤害代表。"],"pulls":["已有姬子·启行 S1 与腾荒 E1S1，当前不需要重复补齐。","星期日专锥只有在其额外回能、用点改善确实解决本队断点时提高优先级。","姬子·启行后续星魂先核对当前版本技能与价格，再和养成其他队伍比较。"],"sources":["expedition","rmc"]},{"id":"fate","name":"Saber × 吉尔伽美什","tag":"能量与行动协作","summary":"双输出拥有能量协作可能，但 Saber 仍用鼹鼠党，整队需要核验能量与辅助受益。吉尔伽美什 78.5% 面板暴伤并不能单独证明配装错误。","variants":[{"name":"双输出能量版","ids":["029","003","014","023"],"note":"星期日支持主输出，藿藿补充能量与生存；与启行、DoT 争辅助。"},{"name":"单核 Saber 版","ids":["029","014","001-C","023"],"note":"移除吉尔伽美什换记忆主，增加辅助但占用主角；需独立实测。"}],"roles":["Saber：主要输出与能量消耗核心。","吉尔伽美什 / 记忆主：前者输出与能量协作，后者辅助推动。","星期日：集中增益与行动调度，明确主要支援谁。","藿藿：治疗、解控、能量和攻击辅助。"],"logic":"通过队友终结技与辅助供能推进核心输出；双输出的优势取决于两人都能兑现行动与增益。单核版牺牲副输出换集中辅助，并非同一套配速的直接替换。","limits":["吉尔伽美什有战斗中暴伤增长，面板暴击 94.5% 可与之匹配；仍需防增益后溢出。","Saber 108 速低于星期日 126，现状不是常见“主 C 先动再拉”的自然顺序。","星神陨落当前记录在流萤身上；不能给两队同时假定装备同一张。"],"fixes":[{"who":"Saber","current":"鼹鼠党 S5，攻 2454，速 108，双暴 50.2 / 207.2。","action":"先确认常驻与爆发期暴击加成；优先比较可用光锥。若借星神，必须同时保存流萤替代方案。","personal":"换光锥可能补基础攻击与增益；不能凭低暴击面板直接砍掉暴伤。","team":"保证主输出的有效伤害，同时避免借装让另一队失去可用性。","accept":"同场景比较完整爆发，并记录借用装备；没有可用替代时保留现有光锥。","cost":"存量培养"},{"who":"吉尔伽美什","current":"E0S1，暴击 94.5%，暴伤 78.5%，核心行迹含 7/9。","action":"先补实际输出相关行迹，再观察兴致叠层后的暴伤；不急换暴伤衣。","personal":"战斗内暴伤增长会改变最佳配比。","team":"能量与输出协作更完整，避免为了好看面板制造暴击不稳。","accept":"记录暖机前后暴击/暴伤，确认辅助暴击叠加后是否溢出。","cost":"存量培养"},{"who":"星期日","current":"速度 126。","action":"先决定高速辅助拉慢 C，还是主 C 先动再拉；选定后成套换装。","personal":"速度目标服务于行动轴，不能孤立喊 134 / 160。","team":"减少拉条浪费并提高主输出受益次数。","accept":"前两轮行动顺序与预设一致，增益覆盖主要攻击。","cost":"存量培养"},{"who":"藿藿","current":"E1，速度 133，回能 119.4%，等价交换 S2。","action":"优先稳定治疗/解控与终结技循环；可补免费光锥叠影时再补。","personal":"生存与回能保持一致，不盲目追高生命。","team":"能量支持真正落到爆发前，减少大招延后一轮。","accept":"记下终结技轮次、受控情况和等价交换实际受益者。","cost":"存量培养"}],"short":["先完成关键行迹与配速方案；现有光锥至少能支撑一套稳定输出流程。","双核与单核各做对照，保存更适合目标场景的一套。"],"long":["在保护另一队装备的前提下确定 Saber 长期光锥。","毕业以能量循环和场景目标为准；Saber 专锥或星魂不是无条件前置。"],"rotation":["辅助资源优先集中到指定主输出，避免无计划平均分配。","记录开局和稳定期能量，不把受击回能视为必然。","换单核版后重新测试配速、战技点与生存。"],"pulls":["Saber 专锥：若现有免费/常驻方案明显限制循环或伤害、且长期主玩她，再进入候选。","星期日专锥：先确认能量与战技点问题；对多支队伍的复用价值高于只看单队数值。","吉尔伽美什已有专锥，先养成再考虑额外星魂。"],"sources":["gil"]},{"id":"dot","name":"持续伤害体系","tag":"命中与循环先于裸攻击","summary":"卡芙卡、黑天鹅 E1、海瑟音已形成现有资产。黑天鹅命中不足是清晰短板；卡芙卡的风套与回能绳则是可验证的循环方案，不能直接判错。","variants":[{"name":"三虚无现有版","ids":["031","017","011","023"],"note":"保留三位持续伤害角色，藿藿负责解控、生存及供能。"},{"name":"阮梅辅助版","ids":["031","017","021","023"],"note":"以阮梅替换海瑟音；减去一个持续伤害位换辅助，并与击破队争阮梅。"}],"roles":["卡芙卡：引爆与循环推动，强化后的命中条件需要保留。","黑天鹅：持续伤害、减防及 E1 价值，命中是关键属性。","海瑟音 / 阮梅：额外持续伤害或全队辅助，按敌人和多队需求选择。","藿藿：解控、生命恢复与能量支持。"],"logic":"先稳定挂上效果与持续伤害，再由卡芙卡推动结算。若命中缺口导致挂不上或转化不足，继续堆攻击无法补回完整损失。增益应按角色自身条件逐一核对。","limits":["70.7% 命中的黑天鹅不能享受资料中要求角色命中 ≥75% 的相关攻击增益条件。","120% 是黑天鹅命中转化的常用上限目标，不代表面对所有敌人的所有效果都 100% 命中。","负面免疫、阶段切换清除和暖机长度会改变表现；不能承诺所有末日场景都优。"],"fixes":[{"who":"黑天鹅","current":"E1，命中 70.7%，攻 3397，速 157；攻击衣自身带命中 7.7%。","action":"换 +15 命中衣：在其余不变且新衣无命中副词条时约为 106.2%；再补约 13.8% 至 120%。","personal":"修正命中与转化缺口，代价是攻击衣主属性；不能用 70.7+43.2 直接算。","team":"挂负面更可靠，也满足强化卡芙卡的相关条件。","accept":"实装后核对显示值；120 是转化目标，敌方效果抵抗仍需单独考虑。","cost":"存量培养"},{"who":"卡芙卡","current":"风 4 + 露莎卡，命中 78.7%，速度 157，回能 124.4%。","action":"保留此套为循环基线，别降到旧攻略中的低命中目标；若换伤害套需整队 A/B。","personal":"当前命中符合 ≥75% 的机制参考条件。","team":"拉条、回能与引爆次数可能抵消个人裸面板损失。","accept":"比较 3 次同场总轮次与引爆次数，而非仅一次战技数字。","cost":"存量培养"},{"who":"海瑟音","current":"命中 80.8%，攻 2997，速 133；攻击鞋、回能绳。","action":"先检查关键效果命中；如追求命中转化上限，120% 可作长期参考，约差 39.2%。速度鞋只在多行动确有收益时换。","personal":"减少效果波动；增速与攻击、回能存在取舍。","team":"避免持续伤害建立太晚，拖慢卡芙卡有效引爆。","accept":"核对客户端转化行迹；记录首次完整挂效果的行动点，不把 120 当所有效果必中。","cost":"存量培养"},{"who":"藿藿","current":"速度 133，回能绳已具备。","action":"先保持治疗、解控与能量供给；若被 Fate 队占用，在分队页换队或实测其他生存位。","personal":"无需为凑统一速度线盲刷。","team":"持续伤害队不因控场或治疗断档失去暖机成果。","accept":"三次目标场景无减员，卡芙卡关键终结技不因调度延后。","cost":"存量培养"}],"short":["黑天鹅命中衣及后续副词条达到机制目标；卡芙卡不破坏现有命中/回能。","建立可靠挂效果—引爆—再覆盖循环，优先使用不争阮梅版本。"],"long":["根据实战确定海瑟音速度、命中与攻击的平衡。","再对比卡芙卡伤害套/循环套以及新增辅助；没有稳定对照前不追精确伤害百分比。"],"rotation":["先挂效果再引爆，记录敌人换阶段后的覆盖恢复速度。","检查强化技能是否与资料一致。","将敌人自然行动触发与主动引爆区分记录，短轴和长轴分开评估。"],"pulls":["已有黑天鹅 E1：优先补命中，后续星魂不解决当前配装缺口。","卡芙卡专锥可在循环已稳、需要更佳个人/体系伤害时比较；不是让队伍能玩的必要条件。","新辅助仅在确切替换一位角色后提高整队表现时考虑，不根据“新版本必抽”下结论。"],"sources":["kafka","swan","hs"]},{"id":"break","name":"流萤击破体系","tag":"三条可切换路线","summary":"大丽花 E1 与阮梅 E1 已是高价值现有投入。击破主 E4、舞！舞！舞！S3 可用；三套配队服务于不同的辅助占用情况。","variants":[{"name":"释放主角主力版","ids":["015","013","021","033"],"note":"流萤 + 大丽花 + 阮梅 + 加拉赫；主角交给欢愉或记忆。"},{"name":"释放阮梅版","ids":["015","013","001-B","033"],"note":"同谐主替阮梅，保留大丽花机制；失去阮梅的独立辅助收益。"},{"name":"传统超击破版","ids":["015","001-B","021","033"],"note":"同谐主 + 阮梅；大丽花释放，伤害窗口与未击破阶段不同。"}],"roles":["流萤：击破输出核心，等级、削韧、速度与击破条件比双暴重要。","大丽花 / 同谐主：超击破与辅助；二者不是完全等价。","阮梅 / 同谐主：效率、增益或击破分享，按队伍占用选择。","加拉赫：治疗、削韧与产点；速度和终结技调度关系到流萤能否连续战技。"],"logic":"先建立弱点、辅助结界与生存，再让流萤在有效窗口连续攻击。速度决定行动，削韧与击破条件决定伤害。全队仅堆某个裸击破数字，无法替代循环完整。","limits":["三套共用流萤与加拉赫，只是替代路线，不能同时分成三队。","同谐主截图未显示回能效率、面板是否含增益未明，不能直接推算固定几动一大。","大丽花已有 E1；现有角色已足够构成完整框架，不能把新生存位当作必抽门槛。"],"fixes":[{"who":"流萤","current":"星神陨落 S1，攻 2648，速 161，击破 158.9%，关键行迹 9。","action":"优先可免费获取的星神叠影与核心行迹；保留攻击衣/球、速度鞋与击破绳。","personal":"攻击与击破转化、倍率基础得到改善；不追常规双暴。","team":"在既有辅助下提高有效输出，成本低于先抽专锥。","accept":"星神逐步到 S5；核对变身后实际速度与行动次数，不能凭裸速宣布最佳轮次。","cost":"存量培养"},{"who":"大丽花","current":"E1，速 153，击破 94.1%，生命衣/球、回能绳，决心 S5。","action":"保留回能基线；先在生命衣/球、头手副词条补击破，再比较击破绳。","personal":"提高自身击破与分享收益；换绳会损失回能，不应机械切换。","team":"输出窗口更完整；治疗/护盾触发条件要按现行技能验证。","accept":"记录开局与续期增益、终结技空窗；击破提高后仍满足生存与循环。","cost":"存量培养"},{"who":"同谐主","current":"E4，速 154，击破 194.3%，舞！舞！舞！S3，击破绳。","action":"先做游戏内可获取的 E6；保留当前高速结构。优先换击破绳无效双暴副词条，换回能绳需 A/B。","personal":"E6 提供额外战技命中；E4 击破分享有队伍价值。","team":"增加削韧/回能机会，舞！舞！舞！以实际施放时点影响队友行动。","accept":"确认免费星魂获取途径；补完整回能页；统计终结技与拉条是否赶上爆发。","cost":"存量培养"},{"who":"阮梅","current":"E1，速 152，击破 130.6%，回能 124.4%。","action":"保留回能；先统计自身/队友战斗内击破增益，再补击破副词条。160 静态只作常见独立配装参考。","personal":"避免重复计算行迹与大丽花、同谐主提供的增益。","team":"不为裸面板目标牺牲能量循环和行动。","accept":"按每个配队分别核对关键转化是否到位；不能跨队沿用同一结论。","cost":"存量培养"},{"who":"加拉赫","current":"E5，速度 122，速度鞋 +13，击破 79.6%，回能 119.4%。","action":"速度鞋先 +15，再补速度与生存；关键治疗和削韧技能补到可升上限。","personal":"鞋子约增加 3 点速度，是确定成本的小修正。","team":"增加产点与治疗机会，缓解 E0 流萤连续战技压力。","accept":"换装后核对实际速度；与阮梅同队的加速不适用于释放阮梅版。","cost":"存量培养"}],"short":["星神叠影、关键行迹、加拉赫鞋子强化优先完成；三套中至少一套循环稳定。","同谐主免费 E6 与完整属性补录；不强求所有角色先达到同一裸击破标准。"],"long":["固定两套可切换方案：一套释放主角，一套释放阮梅。","按实际变身窗口和点数断档决定是否抽流萤 E1 / E2 或替换生存位。"],"rotation":["主输出进入爆发前，检查辅助结界、弱点与可用点数。","同谐主大招时点同时考虑超击破覆盖和舞！舞！舞！拉条。","三种变体分别验收，尤其观察去掉阮梅后的速度与削韧变化。"],"pulls":["流萤 E1：在真实战技点断档反复出现且调度无解时优先评估；E2 是更高预算的行动提升选项，不等于必需。","流萤专锥：先将星神补到可用上限，再比较；不要把 S1 免费光锥对专锥的差距当正常基线。","灵砂等生存候选：仅在加拉赫治疗、清杂、削韧或自动稳定性实测不够时考虑。","同谐主 E6 不属于抽卡预算；舞！舞！舞！S3 已确认，升叠影是随缘改善而非专门抽取目标。"],"sources":["hmc","dahlia","ruan"]},{"id":"followup","name":"飞霄追击体系","tag":"先修知更鸟，再谈托帕","summary":"飞霄、知更鸟 E1、砂金与 E6 三月七/貊泽已经能组成完整框架。托帕虽然已拥有，但仍是 1 级，不能按成品队友计算即时收益。","variants":[{"name":"现有低成本版","ids":["022","034","016","020"],"note":"飞霄 + 巡猎三月七 + 知更鸟 + 砂金。"},{"name":"貊泽替代版","ids":["022","035","016","020"],"note":"貊泽关键技能仍需培养；适合目标相容时验证。"},{"name":"托帕长期版","ids":["022","051","016","020"],"note":"托帕 1 级，需完整升级装备；不能视为即战力。"}],"roles":["飞霄：主要输出，队友频繁攻击帮助体系运转。","三月七 / 貊泽 / 托帕：协同攻击副输出，养成成本差异很大。","知更鸟：全队增益与行动推进，大招覆盖是重点。","砂金：护盾和追击协作；速度与防御须同时满足职责。"],"logic":"频繁协同攻击推动输出，知更鸟在正确窗口放大并推进全队。她的回能缺口会影响整队，而不是只影响辅助个人面板。先修确定问题，再比较副 C。","limits":["知更鸟 +0 击破绳是明确低完成度位置；当前不应据此评估整队上限。","飞霄暴击 67.1%，需要结合战斗增益检查稳定性；不要先无脑堆暴伤。","砂金与 Archer 队冲突，托帕培养不能解决生存位占用。"],"fixes":[{"who":"知更鸟","current":"E1，攻击 3993，速度 129，回能 105%；连结绳为 +0 击破特攻。","action":"优先换 +15 能量恢复效率绳；保留合适内圈套装，副词条攻击优先。","personal":"在相同翁瓦克下显示回能预计从 105% 到 124.4%。","team":"改善全队大招窗口，是高于盲刷主 C 词条的优先事项。","accept":"实装复核 124.4%；记录大招间隔与协奏空窗。","cost":"存量培养"},{"who":"飞霄","current":"星海巡航 S4，攻 2761，速 137，双暴 67.1 / 135.5，关键行迹 9。","action":"可免费获取时补 S5；补关键行迹；结合光锥条件暴击选择副词条。","personal":"提高确定倍率与暴击稳定性。","team":"主爆发更可靠，改善少轮次战斗的波动。","accept":"分别核对敌人高/低生命时的暴击；不把有条件暴击当全程常驻。","cost":"存量培养"},{"who":"砂金","current":"防御 4595，速 111，四件防御主词条。","action":"试速度鞋时复核防御：只扣原 54% 防御主属性约降到 3992，未计新旧副词条。","personal":"速度提升主动行动，但可能跌破 4000 机制参考点。","team":"更主动补盾和产点，前提是不丢防御收益与保护。","accept":"新鞋或其他部位补回缺口，实装确认 ≥4000；再进行生存测试。","cost":"存量培养"},{"who":"三月七 / 貊泽 / 托帕","current":"三月七 E6 已有成套；貊泽技能 5/5/9；托帕 1 级。","action":"先用三月七；选貊泽则补关键行迹；托帕只在确定长期投入后升到可用。","personal":"把培养资源投给实际出战者。","team":"避免同时养三个副 C 却都没完成，提升成队速度。","accept":"相同主队对比副 C；记录养成状态，不拿未练托帕与成品三月七比较。","cost":"存量培养"}],"short":["知更鸟回能绳完成；飞霄光锥/行迹补齐；砂金换鞋通过防御与生存核验。","低成本三月七版连续完成目标场景。"],"long":["根据实测敌方数量、弱点与资源再养托帕或貊泽。","建立无砂金时的替代方案并记录损失；进一步抽卡由多队总收益决定。"],"rotation":["让增益覆盖飞霄主要爆发；不要仅因能量满就立刻交所有终结技。","三月七师父选择与貊泽目标选择分别记录。","知更鸟大招前后都检查行动与战技点。"],"pulls":["知更鸟已经 E1，不需要为了“成型”继续抽星魂。","托帕已经拥有：这是升级问题，不是补新角色问题；专锥或 E1 要与当前副 C 完成度比较。","飞霄专锥是后续投入，先修知更鸟绳和免费光锥；砂金专锥不是单生存成立前提。"],"sources":[]},{"id":"memory","name":"昔涟 × 记忆主","tag":"新增数据改变优先级","summary":"记忆主并非空白账号位置：已有 E6、S5 光锥与 232.4% 暴伤。主要待验证点是 117 速度、行迹和角色定位，不是立刻追加记忆限定角色。","variants":[{"name":"现有协作验证版","ids":["009","001-C","012","014"],"note":"昔涟 + 记忆主 + 风堇 + 星期日。星期日支持谁需明确，阵容上限未实测。"},{"name":"释放星期日版","ids":["009","001-C","012","016"],"note":"知更鸟作为功能位，需先修回能绳；替换后增益适用性与能量需重新测试。"}],"roles":["昔涟：记忆体系核心协作；队友构成、暖机和目标场景共同决定收益。","记忆主：忆灵与增益支持，兼有自身输出；不能只按常规直伤面板评分。","风堇：生命恢复与忆灵行动，给体系提供持续协作。","星期日 / 知更鸟：功能辅助候选，不宣称与所有记忆伤害完全契合。"],"logic":"多位忆灵与角色行动形成协作循环，记忆主行动频率影响技能更新和相关触发；但换速度鞋会失去攻击与原鞋暴伤。因此优先完成行迹，再用同条件测试决定快慢轴。","limits":["截图 19.5% 暴击率不自动等于配错；要看实际输出来源、技能保证/增益与辅助角色职责。","记忆主 232.4% 暴伤不等于全队毕业，也不等于所有暴伤都能按同一倍率分享。","当前第四位是已有角色验证方案；没有当期环境与实战数据，不把它写成公认最优队。"],"fixes":[{"who":"记忆主：行迹","current":"战技 9、天赋 9、终结技 12、忆灵技/天赋 7；E6。","action":"优先核对并补核心辅助与忆灵相关行迹；带星魂加级的 9 不能简单理解为只差 1 级。","personal":"以游戏显示的当前可升上限为准，确定倍率收益比盲刷容易兑现。","team":"提高全队支持与自身循环质量，建立可靠基线。","accept":"逐项截图确认最大可升等级；升级后更新配置记录。","cost":"存量培养"},{"who":"记忆主：鞋子","current":"速 117；攻击鞋 43.2%，副词条暴伤 22%。","action":"准备同套速度鞋作对照；其他不变时静态速度约 142，但攻击与暴伤会下降。","personal":"增加主动行动机会；英豪条件速度另在战斗内计算，不当静态数据。","team":"可能改善辅助覆盖、召唤与触发重置，但必须与慢速高暴伤版比较。","accept":"相同关卡与队友各测试 3 次，比较循环/轮次/存活；不能只看鞋子后速度。","cost":"存量培养"},{"who":"记忆主：球与绳","current":"冰伤球有命中/击破；回能绳有命中 12%，暴伤 11.6%。","action":"先保留回能主词条，替换无关命中与击破副词条。生存不足可对照生命/防御球，保留原冰伤球。","personal":"优化角色职责相关属性；辅助版和兼顾输出版分开保存。","team":"用更稳的生存或更快行动换取持续支持，而非只刷原图评分。","accept":"新配置不拖慢大招；生存球导致的个人伤害损失纳入同队测试。","cost":"存量培养"},{"who":"昔涟","current":"E0，记忆永不落幕 S5，生命 6365，速 154，暴伤 193.5。","action":"先补未满关键行迹；优先保持循环、生命与有效暴伤。","personal":"已有可用基础，无需因为不是专锥就认定缺件。","team":"让协作核心稳定运转，再判断第四位。","accept":"记录关键机制开始生效时间和队友行动贡献；不凭单个截图打毕业分。","cost":"存量培养"},{"who":"风堇 / 功能位","current":"风堇 E0S1，速 176，生命 5412；星期日速 126。","action":"风堇先验证治疗承压；星期日明确受益对象。若换知更鸟，先完成其绳位。","personal":"高速度仍要兼顾治疗；辅助效果不能假设适用所有忆灵/特殊伤害。","team":"把生存、行动与增益真正接到同一条循环。","accept":"三次无减员；记录辅助作用对象与关键窗口，不把辅助人数当收益。","cost":"存量培养"}],"short":["记忆主行迹核对并补齐；完成攻击鞋/速度鞋 A/B；保留回能绳。","昔涟、记忆主、风堇加一个功能位，至少一套在指定场景稳定达标。"],"long":["确定记忆主辅助版或兼顾输出版的长期套装，按实测微调速度与暴伤。","只有确实缺某个输出/协作角色且现有替代不满足目标时，才进入补新角色路线。"],"rotation":["先记录忆灵召唤、消失与辅助触发时点。","分别测试手动与自动，关注召唤/辅助对象选择。","记忆主改鞋或第四人后，旧测试记录标为旧配置；不可沿用通过结论。"],"pulls":["记忆主已 E6S5，不存在再抽其星魂或补现有光锥的需求。","昔涟专锥：如果长期主玩且现有循环或支持瓶颈与专锥效果吻合，再对照评估。","长夜月、遐蝶等未在档案中的角色属于新分支选择，不是这份账号立刻必补的清单；抽前需重新核对版本、队友和预算。"],"sources":["rmc","hero","cyrene"]},{"id":"aoe","name":"群攻与备用体系","tag":"按关卡启用的存量资产","summary":"旧姬子、黑塔已能构成低成本群攻底座；银枝 1 级、符玄遗器全 +0，不能因已拥有就当作已成型战力。该分支针对群怪场景，不替代全部精英战。","variants":[{"name":"姬黑群攻版","ids":["032","043","016","020"],"note":"利用击破与低血触发追击；与飞霄队争知更鸟、砂金。"},{"name":"释放追击辅助版","ids":["032","043","021","023"],"note":"阮梅与藿藿替代，但与击破、DoT 争人，仍需匹配弱点。"},{"name":"银枝长期版","ids":["049","018","014","023"],"note":"银枝需完整培养；双辅助能量/行动方案按敌群单独验收。"}],"roles":["旧姬子：火弱与击破场景的追击输出。","黑塔：低血敌群触发追击，先提升有效暴伤与攻击。","知更鸟 / 阮梅：强化群攻或削韧，使用前考虑其他队占用。","生存位：保证关键输出窗口；竞速能否减生存只在有测试时讨论。"],"logic":"先将敌人削到触发条件，再由连续追击带动清波；敌人是否容易击破、是否有小怪，直接决定这条链能否成立。角色排名不能替代场景判断。","limits":["精英少、敌人血量厚或弱点不匹配时，姬黑不一定胜过主力队。","黑塔已有 76% 暴击而暴伤仅 84.3%，有优化空间；仍先算战斗内属性。","银枝、托帕、符玄等“已拥有但未完成培养”必须与即战力分开。"],"fixes":[{"who":"旧姬子","current":"攻 3412，速 109，双暴 54.4 / 96.6，银河铁道 S1。","action":"先按常用关卡补关键行迹与有效双暴；利用现有套装和共享刷本产物。","personal":"改善触发后的群攻收益。","team":"同样触发次数下更快清波，减少残血敌人滞留。","accept":"记录每波是否能顺畅触发，不以单体 Boss 测试代表群攻表现。","cost":"存量培养"},{"who":"黑塔","current":"E6，攻 2610，双暴 76 / 84.3，核心行迹已有较高等级。","action":"优先把无效副词条换为暴伤/攻击，保留合理暴击。","personal":"弥补暴伤偏低，避免继续堆溢出暴击。","team":"连续追击清理小怪更稳定。","accept":"同波敌群对照测试，确认关键血量阈值能触发与连锁。","cost":"存量培养"},{"who":"银枝","current":"等级 1、无光锥。","action":"只有确认需要物理群攻分支时才启动整套培养；先列升级、光锥、行迹和遗器成本。","personal":"从未练到可用需要整条养成链。","team":"增加属性与群攻场景覆盖，但短期成本高于姬黑修正。","accept":"达到可用配置后独立测试；当前不计入三队即战力。","cost":"存量培养"},{"who":"符玄及其他备用","current":"符玄 E1S1，但全部遗器 +0；希儿/布洛妮娅等有拆装记录。","action":"需要备用生存时先给符玄完整生命/防御与回能方案；否则暂缓。","personal":"拥有星魂专锥不意味着当前有足够保护能力。","team":"防止分队时把未完成角色算成可靠单生存。","accept":"完整强化、解锁行迹并通过生存测试后才标为可用。","cost":"存量培养"}],"short":["先完成姬子/黑塔现有装备的小修正；确定一套不影响两支主队的出场方案。","在真实群怪关卡验证连锁追击，不要求泛用到所有 Boss。"],"long":["按目标内容补银枝或其他属性覆盖；没有实际缺口就不扩张培养面。","让备用体系承担针对性场景，不用无限刷词条追求全能。"],"rotation":["将弱点、敌人数量、清波断点一并写入记录。","首波能过不代表后续波次循环成立。","若减少生存位，明确这是手动竞速特例，必须另做稳定性测试。"],"pulls":["当前群攻优化优先用已有角色，不要求额外限定。","银枝已有 E0，先养成而不是抽星魂；常驻或活动光锥依实际库存判断。","符玄已有 E1S1，先强化遗器；不能通过继续抽卡替代基础养成。"],"sources":[]}],"tasks":[{"id":"robin-rope","priority":"P0","teams":["followup","memory","aoe"],"title":"知更鸟换 +15 回能绳","detail":"同套预计回能 105% → 124.4%；实装复核。","type":"培养"},{"id":"yao-speed","priority":"P0","teams":["elation"],"title":"爻光入战前速度达到 160","detail":"优先球/绳速度副词条；保留回能主词条。","type":"培养"},{"id":"swan-ehr","priority":"P0","teams":["dot"],"title":"黑天鹅命中衣与命中目标","detail":"换衣约 106.2%，继续向 120% 转化目标补；先核对实际值。","type":"培养"},{"id":"gallagher-shoes","priority":"P0","teams":["break"],"title":"加拉赫速度鞋 +13 → +15","detail":"约增加 3 速，随后逐变体验证配速。","type":"培养"},{"id":"rmc-traces","priority":"P1","teams":["memory","expedition","fate"],"title":"补记忆主关键行迹","detail":"9 级含星魂加级，不默认只差 1 级。","type":"培养"},{"id":"rmc-shoes","priority":"P1","teams":["memory","expedition"],"title":"记忆主两种鞋完成 A/B","detail":"117 → 约 142 静态速度，记录攻击与暴伤损失。","type":"测试 function head(k,title,intro,actions=''){return `<div class="page-head"><div><div class="eyebrow">${esc(k)}</div><h1>${esc(title)}</h1><p class="intro">${esc(intro)}</p></div>${actions?`<div class="head-actions no-print">${actions}</div>`:''}</div>`;}
function button(label,action,extra='',cls=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;}
function sources(ids){return `<div class="source-inline">依据：档案快照${ids.map(id=>{const s=D.sources.find(z=>z[0]===id);return s?` · <a href="${esc(s[3])}" target="_blank" rel="noopener noreferrer">${esc(s[1])}</a>`:''}).join('')}<br>上方具体优化路径是基于资料的分析建议，未经本账号实战验证。</div>`;}
function progressTasks(id){const tasks=D.tasks.filter(t=>t.type!=='抽取'&&(t.teams.includes(id)||t.teams.includes('all')));return {total:tasks.length,done:tasks.filter(t=>state.done[t.id]).length};}
function currentTests(id){const s=ts(id);return state.tests.filter(z=>z.team===id&&z.variant===s.variant&&z.revision===s.revision);}
function statusText(id){const s=ts(id),passed=currentTests(id).filter(x=>x.result==='pass').length;return passed?`有 ${passed} 条当前配置通过记录`:{planned:'待验证',usable:'已标记可用',trained:'已标记培养达标',refine:'长期精修中'}[s.status];}
function go(r,focus=true){route=r;selectedProfile=r==='characters'?selectedProfile:null;render();$('.sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');if(focus){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}location.hash=r;}
function render(){
 document.body.classList.toggle('dark',state.theme==='dark');$('#theme').textContent=state.theme==='dark'?'浅色':'深色';$('#goal').value=state.goal;
 $('#nav').innerHTML=navs.map(([id,n],i)=>`<button data-action="nav" data-id="${id}" class="${route===id?'active':''}" ${route===id?'aria-current="page"':''}><span class="nav-index">0${i+1}</span>${n}</button>`).join('');
 $('#breadcrumb').textContent=navs.find(x=>x[0]===route)?.[1]||'账号总览';
 const renderers={overview,teams:teamPage,allocator,characters,pulls,tasks:taskPage,evidence};$('#main').innerHTML=(renderers[route]||overview)();
}
function overview(){
 const done=D.tasks.filter(t=>state.done[t.id]).length,valid=state.tests.filter(z=>{const s=ts(z.team);return z.result==='pass'&&s.revision===z.revision&&s.variant===z.variant}).length;
 return head('Account / 01','先补养成缺口，再追加抽卡','你的优势是体系广、关键辅助投入较深；主要约束是少数明确配装缺口，以及多队同时使用同一辅助和主角。',button('查看培养清单','nav','data-id="tasks"','primary')+button('打印完整指南','print-all'))+
 `<div class="metric-strip"><div class="metric"><strong>59</strong><span>已收录角色 · 61 份配置</span></div><div class="metric"><strong>9</strong><span>体系 · 含替代配队</span></div><div class="metric"><strong>${done}<small> / ${D.tasks.length}</small></strong><span>已勾选行动 · 非毕业率</span></div><div class="metric"><strong>${valid}</strong><span>当前配置通过记录 · 用户录入</span></div></div>
 <div class="section callout"><strong>当前目标：${esc($('#goal option:checked')?.textContent||'稳定通关')}</strong><p>${esc(D.goals[state.goal])}</p></div>
 ${!storageOK?'<div class="section callout warning">未能读取浏览器进度，当前显示默认状态。请在“依据与备份”导入备份，或导出本次记录保存。</div>':''}
 <div class="section grid two"><section class="panel"><div class="section-title"><h2>最值得先做的三件事</h2><span class="tag">分析建议</span></div>${D.priorities.map(p=>`<div class="priority"><span class="num">${p[0]}</span><div><h3>${p[1]}</h3><p>${p[2]}</p></div></div>`).join('')}</section><section class="panel"><h2>角色池的优势与限制</h2><h4>已确认的优势</h4>${list(['欢愉、击破、追击、持续伤害、记忆与联动角色均有资产，选择空间大。','知更鸟 E1、阮梅 E1、大丽花 E1、腾荒 E1S1、Archer E1S1 已有投入；不必从零补队。','同谐主 E4 + 舞！舞！舞！S3，记忆主 E6 + 飞向粉色的明天 S5，已有可验证基础。'])}<h4 class="section">真正的限制</h4>${list(['拥有 ≠ 练好：托帕、银枝等级 1，符玄全 +0，部分老角色装备被拆。','没有当期敌方、实战轴、抽卡预算与完整装备库存，不能声称精确最优或满星保证。','多队争用辅助与唯一主角；需要比较两队/三队整体成绩。'])}</section></div>
 <section class="section"><div class="section-title"><h2>选择一个体系开始</h2><span class="small muted">每队都有原因、目标、替代与验收方法</span></div><div class="grid three">${T.map((t,i)=>`<article class="panel team-card"><div class="ordinal">SYSTEM ${String(i+1).padStart(2,'0')}</div><h3>${esc(t.name)}</h3><span class="tag">${esc(t.tag)}</span><p>${esc(t.summary)}</p>${button('查看完整优化 →','team',`data-id="${t.id}"`)}</article>`).join('')}</div></section>
 <div class="section callout warning"><strong>“最终毕业”在这里指达到你的目标并通过实测。</strong><p>不要求全员满星魂、专锥或完美遗器。所有面板数字都注明静态或战斗条件；页面不生成伤害排名、虚构收益百分比或自动毕业分。</p></div>`;
}
function memberCards(ids){return `<div class="lineup">${ids.map(id=>{const p=profile(id);return `<div class="member"><div class="initial" aria-hidden="true">${esc(display(id).slice(0,1))}</div><strong>${esc(display(id))}</strong><small>Lv.${esc(p.basic['等级'])} · E${esc(String(p.basic['星魂']||'?').split(/[（(]/)[0])}<br>${esc(p.lc[0]||'光锥未记录')} ${p.lc[2]?'· S'+esc(p.lc[2].match(/\d+/)?.[0]||'?'):''}</small><a href="#characters" data-action="profile" data-id="${id}">查看档案 ↗</a></div>`;}).join('')}</div>`;}
function teamBody(t,all=false){const s=ts(t.id),v=t.variants[s.variant],p=progressTasks(t.id);return `
 <div class="${all?'print-team':''}">${head('System / '+String(T.indexOf(t)+1).padStart(2,'0'),t.name,t.summary,button('打印本队','print-team')+button(state.favorites.includes(t.id)?'★ 已偏好':'☆ 设为偏好','favorite',`data-id="${t.id}"`))}

 <div class="grid two"><section class="panel"><h2>四个位置各做什么</h2><div class="role-list">${list(t.roles)}</div></section><section class="panel"><h2>为什么这样组合</h2><p>${esc(t.logic)}</p><span class="tag amber">配队建议 · 待本账号实测</span></section></div>
 <section class="section callout warning"><strong>适用范围与边界</strong>${list(t.limits)}</section>
 <section class="section"><div class="section-title"><h2>逐项优化：改变什么，为什么</h2><span class="tag neutral">${t.fixes.length} 项</span></div><div class="evidence-legend"><span class="tag">当前数据＝档案事实</span><span class="tag amber">优化动作＝分析建议</span><span class="tag neutral">验收＝待验证条件</span></div>${t.fixes.map((f,i)=>`<article class="fix-card"><div class="fix-head"><h3>${String(i+1).padStart(2,'0')} · ${esc(f.who)}</h3><span class="tag neutral">${esc(f.cost)}</span></div><div class="fix-body"><p class="current"><strong>当前：</strong>${esc(f.current)}</p><p class="fix-action">${esc(f.action)}</p><div class="effects"><div><h4>对角色的作用</h4><p>${esc(f.personal)}</p></div><div><h4>对队伍的作用</h4><p>${esc(f.team)}</p></div></div><div class="accept"><strong>如何验收：</strong>${esc(f.accept)}</div></div></article>`).join('')}</section>
 <div class="section grid two"><section class="panel stage"><div class="label">SHORT TERM / 短期毕业</div><h2>先把当前队伍练完整</h2>${list(t.short)}</section><section class="panel stage long"><div class="label">LONG TERM / 最终目标</div><h2>用实测决定最后的投入</h2>${list(t.long)}</section></div>
 <div class="section grid two"><section class="panel"><h2>操作与测试重点</h2>${list(t.rotation)}<p class="small muted section">建议固定敌方、增益和操作方式连续测试 3 次；这是稳定性观察建议，不是统计意义上的精确收益测量。</p></section><section class="panel"><h2>新角色、星魂与专锥</h2>${list(t.pulls)}</section></div>
 <section class="section panel"><h2>其他变体与占用代价</h2>${t.variants.map(z=>`<div class="source-row"><strong>${esc(z.name)}</strong><p>${z.ids.map(display).map(esc).join(' / ')}<br>${esc(z.note)}</p></div>`).join('')}${sources(t.sources)}</section>
 ${all?'':`<section class="section panel no-print"><div class="section-title"><h2>本队培养记录</h2><span class="small muted">${p.done} / ${p.total} 项已勾选</span></div><div class="progress"><span style="width:${p.total?p.done/p.total*100:0}%"></span></div><p class="small muted">任务勾选只表示你完成了行动，不自动认定配装达标或通关。</p><div class="status-box"><label class="field">手动记录培养阶段<select id="team-stage" data-team="${t.id}"><option value="planned" ${s.status==='planned'?'selected':''}>待验证</option><option value="usable" ${s.status==='usable'?'selected':''}>已可用（本人确认）</option><option value="trained" ${s.status==='trained'?'selected':''}>培养达标（本人确认）</option><option value="refine" ${s.status==='refine'?'selected':''}>长期精修</option></select></label><span class="tag">${esc(statusText(t.id))}</span>${button('查看本队清单','team-tasks',`data-id="${t.id}"`)}</div><label class="field">当前配装 / 配速 / 借用装备说明<textarea id="config-note" maxlength="6000" placeholder="例如：换了速度鞋，记忆主面板 142；砂金防御 4020；光锥无借用。">${esc(s.note)}</textarea></label><div class="toolbar">${button('保存配置并使旧测试待复验','save-config',`data-id="${t.id}"`)}<span class="small muted">配置修订 ${s.revision} · 每次保存新说明会更新修订号</span></div></section>${testForm(t)}`}
 </div>`;}
function teamPage(){return `<div class="toolbar no-print"><label>选择体系 <select id="team-select">${T.map(t=>`<option value="${t.id}" ${t.id===selectedTeam?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><span class="small muted">${esc(D.goals[state.goal])}</span></div>${teamBody(teamBy(selectedTeam))}`;}
function testForm(t){const s=ts(t.id);return `<section class="section panel no-print"><h2>实战验收记录</h2><p class="small muted">记录绑定当前变体与配置修订。任何“通过”均为你的记录，页面不会自动验证游戏结果。改了装备请先保存配置；换人只切换变体，旧记录仍保留。</p><form id="test-form" data-team="${t.id}"><div class="form-grid"><label class="field">测试日期<input type="date" name="date" required value="${new Date().toLocaleDateString('en-CA')}"></label><label class="field">模式<select name="mode"><option value="manual">手动</option><option value="auto">自动</option></select></label><label class="field">关卡 / 敌方 / 难度<input name="enemy" maxlength="1000" required placeholder="例如：具体关卡、层数与敌方"></label><label class="field">环境增益 / 特殊条件<input name="buff" maxlength="1000" required placeholder="写明当期增益；无则填无"></label><label class="field">目标与实测结果<input name="metric" maxlength="1000" required placeholder="例如：目标≤5轮；实测4轮、无减员"></label><label class="field">验收判断<select name="result"><option value="observe">仅记录，待判断</option><option value="pass">达到本次目标</option><option value="fail">未达到本次目标</option></select></label><label class="field full">失败点 / 行动顺序 / 备注<textarea name="detail" maxlength="6000" placeholder="哪位角色缺点、增益何时断档、是否依赖受击回能等。"></textarea></label></div><div class="toolbar"><button class="primary" type="submit">保存一次实战记录</button><span class="small muted">${esc(t.variants[s.variant].name)} · 修订 ${s.revision}</span></div></form><div id="test-list">${testList(t.id)}</div></section>`;}
function testList(id){const s=ts(id),tests=state.tests.filter(z=>z.team===id).slice().reverse();return tests.length?tests.map(z=>{const stale=z.revision!==s.revision,other=z.variant!==s.variant;return `<article class="test-item"><div class="meta"><span class="tag ${stale?'amber':z.result==='fail'?'red':''}">${stale?'旧配置 · 待复验':other?'其他变体':{pass:'用户记录：通过',fail:'用户记录：未通过',observe:'待判断'}[z.result]}</span><span>${esc(z.date)} · ${z.mode==='auto'?'自动':'手动'} · ${esc(teamBy(id).variants[z.variant].name)} · 修订 ${z.revision}</span></div><p><strong>${esc(z.enemy)}</strong><br>增益：${esc(z.buff)}<br>结果：${esc(z.metric)}${z.detail?'<br>备注：'+esc(z.detail):''}</p>${z.config?`<details><summary>测试时的配装说明</summary><p>${esc(z.config)}</p></details>`:''}${button('删除这条记录','delete-test',`data-id="${esc(z.id)}"`)}</article>`;}).join(''):'<p class="empty">还没有测试记录。先保存配装，再记录一次真实战斗。</p>';}
function allocOptions(value){return T.flatMap(t=>t.variants.map((v,i)=>`<option value="${t.id}:${i}" ${value===`${t.id}:${i}`?'selected':''}>${esc(t.name+' · '+v.name)}</option>`)).join('');}
function parseAllocation(a){const [id,i]=a.split(':');return {team:teamBy(id),v:teamBy(id).variants[+i],i:+i};}
function conflicts(vals){const used=new Map();vals.forEach((a,i)=>parseAllocation(a).v.ids.forEach(id=>{const key=profile(id).identity;if(!used.has(key))used.set(key,[]);used.get(key).push({slot:i,name:display(id)});}));return [...used].filter(([k,v])=>v.length>1);}
function allocator(){const slots=state.allocation,cf=conflicts(slots),untrained=[...new Set(slots.flatMap(a=>parseAllocation(a).v.ids))].filter(id=>Number(profile(id).basic['等级'])<70);return head('Deployment / 03','多队分配与占用检查','按实际同时出战的队伍组合检查。主角三个命途共用同一个人；这里判断能否同时组队，不计算伤害高低。')+
 `<div class="toolbar"><label>队伍数量 <select id="team-count"><option value="2" ${slots.length===2?'selected':''}>两队</option><option value="3" ${slots.length===3?'selected':''}>三队</option></select></label>${button('载入无重人三队示例','allocation-preset')}<span class="small muted">示例不等于当期最优；需要各队实测。</span></div>
 <div class="allocator-grid">${slots.map((a,i)=>{const {v}=parseAllocation(a);return `<section class="panel"><div class="eyebrow">TEAM 0${i+1}</div><label class="field">选择体系与变体<select class="allocation-select" data-slot="${i}">${allocOptions(a)}</select></label><div>${v.ids.map(id=>`<span class="chip">${esc(display(id))}</span>`).join('')}</div><p class="small muted section">${esc(v.note)}</p></section>`;}).join('')}</div>
 <section class="section panel"><div class="section-title"><h2>当前组合检查</h2><span class="tag ${cf.length?'red':''}">${cf.length?cf.length+' 处角色冲突':'无角色重复'}</span></div>${cf.length?cf.map(([k,v])=>`<div class="callout danger section"><strong>${k==='001'?'开拓者只能占一个位置':esc(profile(k).name)+' 被重复使用'}</strong><p>${v.map(x=>`队伍 ${x.slot+1}：${esc(x.name)}`).join('；')}</p><p>${esc(conflictAdvice(k))}</p></div>`).join(''):'<p>所选名单没有共享角色。还需核对装备库存、练度与关卡相性，不能据此认定都能通关。</p>'}${untrained.length?`<div class="callout warning section"><strong>尚未完成培养：</strong>${untrained.map(display).map(esc).join('、')}。这些角色目前不能按成品即战力估算。</div>`:''}<div class="callout warning section"><strong>装备占用尚不能自动确认。</strong><p>档案只记录穿戴，没有完整仓库与物品唯一编号。同名舞！舞！舞！、决心、星神及遗器跨配置借用都要人工核对。</p></div></section>
 <section class="section panel"><h2>可考虑的无重人替换</h2><p class="small muted">仅对该槽位替换后整组不重人的方案进行枚举；排序沿用报告顺序，不代表强度。</p>${slots.map((a,slot)=>{const candidates=T.flatMap(t=>t.variants.map((v,i)=>({value:t.id+':'+i,t,v}))).filter(c=>c.value!==a&&!conflicts(slots.map((x,i)=>i===slot?c.value:x)).length).slice(0,5);return `<div class="source-row"><h3>队伍 ${slot+1}</h3>${candidates.length?candidates.map(c=>`<p>${button(esc(c.t.name+' · '+c.v.name),'alloc-replace',`data-slot="${slot}" data-value="${c.value}"`)}<br>${esc(c.v.note)}</p>`).join(''):'<p>单改这一队无法消除所有冲突；请同时调整其他队伍，或载入示例重新安排。</p>'}</div>`;}).join('')}</section>
